/* The statuses wear the app's own colours: mint is done and good, amber waits
   on something, the app's quiet indigo is newer than tested (we're testing it),
   red is refused, and zinc is not yet known. Each cell also says its status in words for a screen reader,
   and the text of every cell has at least 4.5:1 against its fill in both themes
   (tools/check-status.mjs measures it). */
:root{
  color-scheme:dark;
  --ink:#09090b; --deep:#0e0e11; --panel:#18181b;
  --line:#3f3f46; --line-soft:#27272a;
  --text:#fafafa; --muted:#a1a1aa;
  --accent:#a5b4fc; --violet:#a78bfa; --brand-glow:0 0 14px rgba(139,92,246,.7);
  --go:#7c3aed; --go-edge:#8b5cf6; --go-hover:#6d28d9; --glow:rgba(139,92,246,.45);
  --wash:radial-gradient(760px 420px at 0 0,rgba(124,58,237,.16),transparent 70%),radial-gradient(900px 520px at 100% 100%,rgba(99,102,241,.06),transparent 70%);
  --st-supported:#6ee7b7;   --st-supported-text:#09090b;
  --st-issues:#fcd34d;      --st-issues-text:#09090b;
  --st-newer:#3730a3;       --st-newer-text:#e0e7ff;
  --st-unsupported:#f87171; --st-unsupported-text:#09090b;
  --st-grey:#27272a;        --st-grey-text:#d4d4d8;
  --sans:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --wrap:1180px; --gutter:clamp(16px,4vw,40px);
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme:light;
    --ink:#ffffff; --deep:#f4f4f5; --panel:#f4f4f5;
    --line:#d4d4d8; --line-soft:#e4e4e7;
    --text:#09090b; --muted:#5f5f68;
    --accent:#4338ca; --violet:#6d28d9; --brand-glow:none;
    --wash:radial-gradient(760px 420px at 0 0,rgba(124,58,237,.07),transparent 70%);
    --st-newer:#e0e7ff;       --st-newer-text:#3730a3;
    --st-grey:#e4e4e7;        --st-grey-text:#3f3f46;
  }
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);font:400 17px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:var(--wash),var(--ink);
}
img{display:block;max-width:100%;height:auto}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:4px}
p{margin:0 0 1em}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gutter)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--go);color:#fff;
  padding:10px 14px;border-radius:6px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}

/* ---- top bar ---- */
.bar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line-soft);
  background:var(--ink);background:color-mix(in srgb,var(--ink) 80%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .wrap{display:flex;align-items:center;gap:28px;height:60px}
/* The wordmark as the app sets it: spaced mono capitals in violet. */
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;
  font:700 12px/1 var(--mono);letter-spacing:.19em;text-transform:uppercase;color:var(--violet);text-shadow:var(--brand-glow)}
.brand img{width:26px;height:26px;border-radius:6px}
.button{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:11px 18px;
  font:600 15.5px/1.2 var(--sans);text-decoration:none;border:1px solid var(--line);cursor:pointer}
.button-go{background:var(--go);border-color:var(--go-edge);color:#fff;
  box-shadow:0 0 0 1px rgba(139,92,246,.2),0 4px 18px -6px var(--glow)}
.button-go:hover{background:var(--go-hover);box-shadow:0 0 0 1px rgba(167,139,250,.45),0 0 22px -4px var(--glow)}
.bar .button{margin-left:auto;padding:8px 14px;font-size:14px}

/* ---- the page ---- */
main h1{font-family:var(--sans);font-weight:650;margin:0;font-size:clamp(2.2rem,1.2rem + 4vw,3.75rem);line-height:1.04;letter-spacing:-.035em;text-wrap:balance}
.head{padding:clamp(40px,7vw,80px) 0 0}
.updated{font:500 13px var(--mono);letter-spacing:.04em;color:var(--muted);margin:16px 0 0}
.unavailable{margin:24px 0 0;max-width:62ch;font-size:1.05rem}
.unavailable[hidden]{display:none}

/* The key: each colour in its own words. */
.key{list-style:none;margin:clamp(22px,3vw,30px) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 10px}
.chip{display:inline-block;font:600 13.5px/1.3 var(--sans);padding:5px 12px;border-radius:999px}

/* A status's colours: the cell, and the chip of the key. */
.st-supported{background:var(--st-supported);color:var(--st-supported-text)}
.st-issues{background:var(--st-issues);color:var(--st-issues-text)}
.st-newer{background:var(--st-newer);color:var(--st-newer-text)}
.st-unsupported{background:var(--st-unsupported);color:var(--st-unsupported-text)}
.st-unmeasured,.st-absent{background:var(--st-grey);color:var(--st-grey-text)}

/* The matrix: a row for each agent, and for each release a Mac and a Windows cell. */
.tablewrap{margin-top:clamp(22px,3vw,30px)}
.matrix{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.matrix th,.matrix td{text-align:left;vertical-align:middle}
.matrix thead th{font:600 15px/1.3 var(--mono);padding:6px 8px 2px;text-align:center}
.matrix thead tr + tr th{font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.matrix thead tr:first-child th:first-child{text-align:left;width:15%}
.matrix tbody th{font-size:1.05rem;font-weight:600;letter-spacing:-.01em;padding:8px 8px 8px 2px}
.matrix td{padding:12px 14px;border-radius:6px;font:500 14px/1.4 var(--mono);overflow-wrap:break-word}
.matrix td .t{display:inline}
.matrix td.st-unmeasured,.matrix td.st-absent{font:400 13.5px/1.4 var(--sans)}
.mark{display:inline-flex;align-items:center;justify-content:center;min-width:1.4em;height:1.4em;margin-left:.5em;border:1.5px solid currentColor;border-radius:50%;font:700 11px/1 var(--mono);vertical-align:.12em}

/* Under the table: what each mark says, in one line. */
.issues{list-style:none;margin:20px 0 0;padding:0;max-width:78ch}
.issues li{display:flex;gap:10px;align-items:baseline;margin:0 0 8px;font-size:15.5px;line-height:1.45}
.issues .mark{flex:none;margin:0;color:var(--text)}

/* Narrow: one block for each agent, with the same colours. */
@media (max-width:720px){
  .matrix thead{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0)}
  .matrix,.matrix tbody,.matrix tr,.matrix th,.matrix td{display:block}
  .matrix{border-spacing:0}
  .matrix tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;padding:14px;border:1px solid var(--line-soft);border-radius:10px;background:var(--panel)}
  .matrix tbody th{grid-column:1 / -1;padding:0 0 2px;font-size:1.25rem}
  .matrix td::before{content:attr(data-label);display:block;font:700 10.5px/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px}
}

/* ---- footer ---- */
footer{padding:clamp(56px,8vw,96px) 0 56px}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;font-size:14.5px}
.foot ul{display:flex;flex-wrap:wrap;gap:10px 22px;list-style:none;margin:0;padding:0}
.foot a:not(.brand){color:var(--muted);text-decoration:none}
.foot a:not(.brand):hover{color:var(--text);text-decoration:underline}
.foot .mit{width:100%;color:var(--muted);margin:0;font-size:14px}

@media (max-width:600px){body{font-size:16.5px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

                  "text": "A reminder that a task is still at work in the background can reach the chief late, or after the hold has ended, when it was already on its way to the chief's window."
                },
                {
                  "text": "A member's dialog that ConsensFlow tried to decline, and that the window's host refused the key for, stays shown and open; the notes can say that ConsensFlow declined it. The member waits until someone answers it in the window."
                },
                {
                  "text": "After the update, a chief or member whose window was left open from before the app moved to another path is told its role again at each Resume, and a role read early under an earlier 3.0.7 build is told once more."
                },
                {
                  "text": "If Close is pressed while a window that failed to return at Resume is still waiting for an unanswered request to end it, Close can take up to 30 seconds to answer; the next Resume waits for it."
                },
                {
                  "text": "A member whose earlier turn was aborted by itself or by a pause can be told to go on after a Resume while its task is Working. The record cannot always tell what stopped the turn."
                },
                {
                  "text": "If the trace purge fails when a project is deleted, the project's old trace lines can remain in events.jsonl, potentially including task text. The failure is only in daemon.log, which may also be unwritable; there is no automatic retry."
                },
                {
                  "text": "If the system cannot supply secure randomness as the daemon starts, the app can say only that the daemon stopped before it was ready and can keep retrying."
                },
                {
                  "text": "A failure to kill or wait for the daemon while stopping or connecting, to redirect the app's error output, or to show a crash dialog can still go unreported. On Windows the daemon's error log can also be unavailable without a warning."
                },
                {
                  "text": "If the app cannot send the page an update after human input, the page may be out of date; the warning is in the app's error log and is not shown on the page."
                },
                {
                  "text": "A command whose shell the harness ends can leave a child running and unreported until the window closes. On a Mac, a command detached into a session of its own can outlive the window too and the chief may not be told; this was seen with Pi."
                },
                {
                  "text": "Windows: if a project's folder has been moved, deleted or is unavailable, a window can start in the user's home folder instead, without a warning. This is read from the code and has not been checked on a real Windows window."
                },
                {
                  "text": "A long paste into a window that is slow to read can split an Escape-led key such as an arrow or a paste marker. The harness can receive a lone Escape, which can interrupt its turn. This has been measured on both Mac and Windows."
                },
                {
                  "text": "Muse Code: a project's compaction size above 512,000 tokens is not passed to a member; Muse uses its own point instead."
                },
                {
                  "text": "While one window's program is starting, reads and controls of other windows must wait for that launch. A slow launch can delay their updates."
                },
                {
                  "text": "The trace in events.jsonl can contain a line for a ledger event that was later rolled back, so a line there alone does not prove the event committed."
                },
                {
                  "text": "Claude Code, Codex, Pi and Muse Code: if a first model call lasts over two minutes and the window's screen stays quiet, ConsensFlow can pause the task as if its turn had never begun. This is read from the code; it has not been seen on a real board."
                },
                {
                  "text": "A long chief role can need several reads, especially with long staff rules or full paths. Each part except the last gives the command for the next."
                },
                {
                  "text": "Some dim terminal colors can be hard to read, especially dim blue; normal and bright shades can look alike on colored backgrounds. Where History's font has no italic face, the system synthesizes one."
                },
                {
                  "text": "A folded group can say a quota-held task is \"paused, to resume\" even when that task can resume by itself."
                },
                {
                  "text": "Muse Code: a chief can wait in its shell for a board result even though its instructions say the result will be delivered. One checked chief waited 30 seconds; a retry did not."
                },
                {
                  "text": "On Windows, a command may be left running without a note if the app's process look misses it while a window is closing. A process was missed once under heavy load on an earlier build; later attempts did not reproduce the miss."
                },
                {
                  "text": "A slow disk write can delay board updates, message deliveries and timers while the daemon waits for the write to finish."
                },
                {
                  "text": "The Mac checks used Claude Code 2.1.326, Codex 0.169.0, Pi 1.5.2, Devin 3000.13.4 and Muse Code 1.4.23-R8977.1. Windows used Claude Code 2.1.326, Codex 0.169.0, Pi 1.5.2, Devin 3000.12.57 and Muse Code 1.4.20-R8619.1; Windows Devin and Muse Code were older."
                },
                {
                  "text": "On Windows, Ctrl+V was checked with a test paste, not the real clipboard."
                },
                {
                  "text": "Sending a tell to an active agent, Pause, Resume after a quit, Finish and \"Do with your own hands\" were not run again on the real harnesses. These flows are unchanged since the previous 3.0.7 update."
                },
                {
                  "text": "Terminal selection over colored text and the full 256-color and truecolor ranges were not audited."
                },
                {
                  "text": "No long run was made for this alpha."
                }
              ]
            }
          }
        }

<script>
// Supported versions: draws the matrix of #status-data. A row for each agent; for
// each release, in the order the data gives them, a Mac and a Windows cell holding
// the range of versions that release supports, coloured by the cell's status. A
// cell's known issues are numbered marks, each said once under the table. Everything the
// data says goes in with textContent, never as markup. No version is named here.
(function(){
  var PLATFORMS = [
    { id: 'mac', label: 'Mac' },
    { id: 'windows', label: 'Windows' }
  ];
  // The statuses, in the order of the key. A harness that is not in a release, and
  // a platform with nothing measured, are both grey.
  var STATES = [
    { id: 'supported', label: 'Supported' },
    { id: 'issues', label: 'Supported, with a known issue' },
    { id: 'newer', label: 'Newer than tested (we’re testing it)' },
    { id: 'unsupported', label: 'Not supported' },
    { id: 'unmeasured', label: 'Not yet measured, or not in this release' }
  ];
  var WORDS = {
    supported: 'Supported',
    issues: 'Supported, with a known issue',
    newer: 'Newer than tested',
    unsupported: 'Not supported',
    unmeasured: 'Not yet measured',
    absent: 'Not in this release'
  };
  var SAID = { looking: ' We’re looking into it.', fixing: ' Being fixed.' };
  var UNAVAILABLE = "The list of supported versions can't be shown right now. The releases are at github.com/ngvoicu/consensflow/releases.";

  function el(tag, props, kids) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function(key){
      if (key === 'text') node.textContent = props[key]; else node.setAttribute(key, props[key]);
    });
    (kids || []).forEach(function(kid){ if (kid) node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid); });
    return node;
  }
  function str(value) { return typeof value === 'string' ? value : ''; }
  function known(status) { return WORDS[status] ? status : 'unmeasured'; }

  // The numbered issues of the table: one line for each distinct text, in the order
  // the table first meets it.
  function Issues() {
    var list = [];
    return {
      list: list,
      number: function(issue) {
        var text = str(issue.text);
        for (var i = 0; i < list.length; i++) if (list[i].text === text) return i + 1;
        list.push({ text: text, state: str(issue.state) });
        return list.length;
      }
    };
  }

  function range(cell) {
    var from = str(cell.from), to = str(cell.to);
    return from && to && from !== to ? from + ' – ' + to : to || from;
  }

  function cell(release, harness, plat, entry, issues) {
    var data = entry || {};
    var status = entry ? known(data.status) : 'absent';
    if (status !== 'absent' && status !== 'unmeasured' && !range(data)) status = 'unmeasured';
    var label = str(release.channel) + ' ' + str(release.version) + ' · ' + plat.label;
    var kids;
    if (status === 'absent') {
      kids = [WORDS[status]];
    } else {
      kids = status === 'unmeasured'
        ? [el('span', { 'class': 't', text: WORDS[status] })]
        : [el('span', { 'class': 'sr', text: WORDS[status] + ': ' }), el('span', { 'class': 't', text: range(data) })];
      (Array.isArray(data.issues) ? data.issues : []).forEach(function(issue){
        if (!issue || !str(issue.text)) return;
        var n = issues.number(issue);
        kids.push(el('span', { 'class': 'mark', role: 'img', 'aria-label': 'Known issue ' + n, text: String(n) }));
      });
    }
    return el('td', {
      'class': 'st st-' + status,
      'data-label': label,
      'data-release': str(release.version),
      'data-harness': str(harness.id),
      'data-platform': plat.id,
      'data-status': status
    }, kids);
  }

  function entryOf(release, id, plat) {
    var found = (release.harnesses || []).filter(function(h){ return h && h.id === id; })[0];
    return found && found.platforms ? found.platforms[plat] : null;
  }

  function show(data) {
    var releases = (data.releases || []).filter(function(r){ return r && typeof r === 'object'; });
    var agents = data.harnesses || [];
    var out = document.getElementById('list');

    document.getElementById('updated').textContent = 'Updated ' + str(data.updated);
    document.getElementById('updated').hidden = false;

    var key = document.getElementById('key');
    STATES.forEach(function(s){ key.appendChild(el('li', { 'data-state': s.id }, [el('span', { 'class': 'chip st-' + s.id, text: s.label })])); });
    key.hidden = false;

    var issues = Issues();
    var head1 = el('tr', {}, [el('th', { scope: 'col', rowspan: '2', text: 'Agent' })]);
    var head2 = el('tr');
    releases.forEach(function(r){
      head1.appendChild(el('th', { scope: 'colgroup', colspan: String(PLATFORMS.length), text: str(r.channel) + ' ' + str(r.version) }));
      PLATFORMS.forEach(function(p){ head2.appendChild(el('th', { scope: 'col', text: p.label })); });
    });
    var body = el('tbody');
    agents.forEach(function(agent){
      var row = el('tr', { 'data-harness': str(agent.id) }, [el('th', { scope: 'row', text: str(agent.name) })]);
      releases.forEach(function(r){
        PLATFORMS.forEach(function(p){ row.appendChild(cell(r, agent, p, entryOf(r, agent.id, p.id), issues)); });
      });
      body.appendChild(row);
    });
    out.appendChild(el('div', { 'class': 'tablewrap' }, [el('table', { 'class': 'matrix' }, [
      el('caption', { 'class': 'sr', text: 'The versions of each coding agent that each ConsensFlow release supports, on Mac and Windows' }),
      el('thead', {}, [head1, head2]),
      body
    ])]));

    if (issues.list.length) {
      out.appendChild(el('ol', { 'class': 'issues' }, issues.list.map(function(issue, i){
        return el('li', {}, [el('span', { 'class': 'mark', text: String(i + 1) }), el('span', { text: issue.text + (SAID[issue.state] || '') })]);
      })));
    }
  }

  var data;
  try { data = JSON.parse(document.getElementById('status-data').textContent); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.releases) || !Array.isArray(data.harnesses)) {
    var note = document.getElementById('unavailable');
    note.textContent = UNAVAILABLE;
    note.hidden = false;
    if (window.console) console.warn('Supported versions: the data block could not be read.');
  } else {
    show(data);
  }
})();
</script>
