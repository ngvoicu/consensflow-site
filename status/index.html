<style>
/* The site's own faces and palette (see the home page), self-hosted: no CDN. */
@font-face{font-family:'Archivo';font-style:normal;font-weight:400;font-display:swap;src:url('../assets/fonts/archivo-400.woff2') format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:500;font-display:swap;src:url('../assets/fonts/archivo-500.woff2') format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:700;font-display:swap;src:url('../assets/fonts/archivo-700.woff2') format('woff2')}
@font-face{font-family:'Archivo';font-style:normal;font-weight:800;font-display:swap;src:url('../assets/fonts/archivo-800.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url('../assets/fonts/ibm-plex-mono-400.woff2') format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url('../assets/fonts/ibm-plex-mono-500.woff2') format('woff2')}

/* The statuses wear the palette's own colours: seafoam, amber, slate, buoy and a
   muted foam. Each cell also says its status in words for a screen reader, and the
   text of every cell has at least 4.5:1 against its fill in both themes
   (tools/check-status.mjs measures it). */
:root{
  color-scheme:dark;
  --ink:#08181d; --deep:#0c2026; --panel:#112a31;
  --line:#28464d; --line-soft:#1c373e;
  --text:#e9f1ef; --muted:#9db4b8;
  --accent:#63c7b2; --accent-fill:#63c7b2; --on-accent:#08181d;
  --grid:rgba(99,199,178,.035);
  --st-supported:#63c7b2;   --st-supported-text:#08181d;
  --st-issues:#e7b968;      --st-issues-text:#08181d;
  --st-newer:#3d5b62;       --st-newer-text:#e9f1ef;
  --st-unsupported:#ff7868; --st-unsupported-text:#08181d;
  --st-grey:#1c373e;        --st-grey-text:#b3c7ca;
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --wrap:1180px; --gutter:clamp(20px,4vw,40px);
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme:light;
    --ink:#eef4f2; --deep:#e2ecea; --panel:#ffffff;
    --line:#bfd2cf; --line-soft:#d5e2e0;
    --text:#0b1f24; --muted:#4a646a;
    --accent:#16766a; --accent-fill:#16766a; --on-accent:#ffffff;
    --grid:rgba(22,118,106,.05);
    --st-supported:#63c7b2;   --st-supported-text:#08181d;
    --st-issues:#e7b968;      --st-issues-text:#08181d;
    --st-newer:#3d5b62;       --st-newer-text:#ffffff;
    --st-unsupported:#ff7868; --st-unsupported-text:#08181d;
    --st-grey:#d5e2e0;        --st-grey-text:#334c52;
  }
}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--text);font:400 18px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  background:linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--ink);
}
img{display:block;max-width:100%;height:auto}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
p{margin:0 0 1em}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gutter)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--accent-fill);color:var(--on-accent);
  padding:10px 14px;border-radius:6px;font-weight:700;text-decoration:none}
.skip:focus{top:12px}

/* ---- top bar ---- */
.bar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--line-soft);
  background:var(--ink);background:color-mix(in srgb,var(--ink) 86%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .wrap{display:flex;align-items:center;gap:28px;height:60px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.01em}
.brand img{width:26px;height:26px;border-radius:6px}
.button{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:11px 18px;
  font:700 16px/1.2 var(--sans);text-decoration:none;border:1px solid transparent;cursor:pointer}
.button-go{background:var(--accent-fill);color:var(--on-accent)}
.button-go:hover{filter:brightness(1.08)}
.bar .button{margin-left:auto;padding:8px 14px;font-size:15px}

/* ---- the page ---- */
main h1{font-family:var(--sans);font-weight:800;margin:0;font-size:clamp(2.2rem,1.2rem + 4vw,3.75rem);line-height:1.04;letter-spacing:-.035em;text-wrap:balance}
.head{padding:clamp(40px,7vw,80px) 0 0}
.updated{font:500 13px var(--mono);letter-spacing:.04em;color:var(--muted);margin:16px 0 0}
.unavailable{margin:24px 0 0;max-width:62ch;font-size:1.05rem}
.unavailable[hidden]{display:none}

/* The key: each colour in its own words. */
.key{list-style:none;margin:clamp(22px,3vw,30px) 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 10px}
.chip{display:inline-block;font:700 14px/1.3 var(--sans);padding:5px 12px;border-radius:999px}

/* A status's colours: the cell, and the chip of the key. */
.st-supported{background:var(--st-supported);color:var(--st-supported-text)}
.st-issues{background:var(--st-issues);color:var(--st-issues-text)}
.st-newer{background:var(--st-newer);color:var(--st-newer-text)}
.st-unsupported{background:var(--st-unsupported);color:var(--st-unsupported-text)}
.st-unmeasured,.st-absent{background:var(--st-grey);color:var(--st-grey-text)}

/* The matrix: a row for each agent, and for each release a Mac and a Windows cell. */
.tablewrap{margin-top:clamp(22px,3vw,30px)}
.matrix{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed}
.matrix th,.matrix td{text-align:left;vertical-align:middle}
.matrix thead th{font:700 15px/1.3 var(--sans);padding:6px 8px 2px;text-align:center}
.matrix thead tr + tr th{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.matrix thead tr:first-child th:first-child{text-align:left;width:15%}
.matrix tbody th{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;padding:8px 8px 8px 2px}
.matrix td{padding:12px 14px;border-radius:8px;font:500 14px/1.4 var(--mono);overflow-wrap:break-word}
.matrix td .t{display:inline}
.matrix td.st-unmeasured,.matrix td.st-absent{font:400 13.5px/1.4 var(--sans)}
.mark{display:inline-flex;align-items:center;justify-content:center;min-width:1.4em;height:1.4em;margin-left:.5em;border:1.5px solid currentColor;border-radius:50%;font:700 11px/1 var(--sans);vertical-align:.12em}

/* Under the table: what each mark says, in one line. */
.issues{list-style:none;margin:20px 0 0;padding:0;max-width:78ch}
.issues li{display:flex;gap:10px;align-items:baseline;margin:0 0 8px;font-size:15.5px;line-height:1.45}
.issues .mark{flex:none;margin:0;color:var(--text)}
.other{margin:20px 0 0;max-width:78ch;font-size:15.5px;color:var(--muted)}

/* Narrow: one block for each agent, with the same colours. */
@media (max-width:720px){
  .matrix thead{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0)}
  .matrix,.matrix tbody,.matrix tr,.matrix th,.matrix td{display:block}
  .matrix{border-spacing:0}
  .matrix tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .matrix tbody th{grid-column:1 / -1;padding:0 0 2px;font-size:1.25rem}
  .matrix td::before{content:attr(data-label);display:block;font:500 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
}

/* ---- footer ---- */
footer{padding:clamp(56px,8vw,96px) 0 56px}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px 32px;font-size:15px}
.foot .brand{font-size:17px}
.foot ul{display:flex;flex-wrap:wrap;gap:10px 22px;list-style:none;margin:0;padding:0}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--text);text-decoration:underline}
.foot .mit{width:100%;color:var(--muted);margin:0;font-size:14px}

@media (max-width:600px){body{font-size:17px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<script>
// Supported versions: draws the matrix of #status-data. A row for each agent; for
// each release, in the order the data gives them, a Mac and a Windows cell holding
// the range of versions that release supports, coloured by the cell's status. A
// cell's known issue is a numbered mark, said once under the table. Everything the
// data says goes in with textContent, never as markup. No version is named here.
(function(){
  var PLATFORMS = [
    { id: 'mac', label: 'Mac' },
    { id: 'windows', label: 'Windows' }
  ];
  // The statuses, in the order of the key. A harness that is not in a release, and
  // a platform with nothing measured, are both grey.
  var STATES = [
    { id: 'supported', label: 'Supported' },
    { id: 'issues', label: 'Supported, with a known issue' },
    { id: 'newer', label: 'Newer than tested (we’re testing it)' },
    { id: 'unsupported', label: 'Not supported' },
    { id: 'unmeasured', label: 'Not yet measured, or not in this release' }
  ];
  var WORDS = {
    supported: 'Supported',
    issues: 'Supported, with a known issue',
    newer: 'Newer than tested',
    unsupported: 'Not supported',
    unmeasured: 'Not yet measured',
    absent: 'Not in this release'
  };
  var SAID = { looking: ' We’re looking into it.', fixing: ' Being fixed.' };
  var UNAVAILABLE = "The list of supported versions can't be shown right now. The releases are at github.com/ngvoicu/consensflow/releases.";

  function el(tag, props, kids) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function(key){
      if (key === 'text') node.textContent = props[key]; else node.setAttribute(key, props[key]);
    });
    (kids || []).forEach(function(kid){ if (kid) node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid); });
    return node;
  }
  function str(value) { return typeof value === 'string' ? value : ''; }
  function known(status) { return WORDS[status] ? status : 'unmeasured'; }

  // The numbered issues of the table: one line for each distinct text, in the order
  // the table first meets it.
  function Issues() {
    var list = [];
    return {
      list: list,
      number: function(issue) {
        var text = str(issue.text);
        for (var i = 0; i < list.length; i++) if (list[i].text === text) return i + 1;
        list.push({ text: text, state: str(issue.state) });
        return list.length;
      }
    };
  }

  function range(cell) {
    var from = str(cell.from), to = str(cell.to);
    return from && to && from !== to ? from + ' – ' + to : to || from;
  }

  function cell(release, harness, plat, entry, issues) {
    var data = entry || {};
    var status = entry ? known(data.status) : 'absent';
    if (status !== 'absent' && status !== 'unmeasured' && !range(data)) status = 'unmeasured';
    var label = str(release.channel) + ' ' + str(release.version) + ' · ' + plat.label;
    var kids;
    if (status === 'absent' || status === 'unmeasured') {
      kids = [WORDS[status]];
    } else {
      kids = [el('span', { 'class': 'sr', text: WORDS[status] + ': ' }), el('span', { 'class': 't', text: range(data) })];
      if (data.issue && str(data.issue.text)) {
        var n = issues.number(data.issue);
        kids.push(el('span', { 'class': 'mark', role: 'img', 'aria-label': 'Known issue ' + n, text: String(n) }));
      }
    }
    return el('td', {
      'class': 'st st-' + status,
      'data-label': label,
      'data-release': str(release.version),
      'data-harness': str(harness.id),
      'data-platform': plat.id,
      'data-status': status
    }, kids);
  }

  function entryOf(release, id, plat) {
    var found = (release.harnesses || []).filter(function(h){ return h && h.id === id; })[0];
    return found && found.platforms ? found.platforms[plat] : null;
  }

  function show(data) {
    var releases = (data.releases || []).filter(function(r){ return r && typeof r === 'object'; });
    var agents = data.harnesses || [];
    var out = document.getElementById('list');

    document.getElementById('updated').textContent = 'Updated ' + str(data.updated);
    document.getElementById('updated').hidden = false;

    var key = document.getElementById('key');
    STATES.forEach(function(s){ key.appendChild(el('li', { 'data-state': s.id }, [el('span', { 'class': 'chip st-' + s.id, text: s.label })])); });
    key.hidden = false;

    var issues = Issues();
    var head1 = el('tr', {}, [el('th', { scope: 'col', rowspan: '2', text: 'Agent' })]);
    var head2 = el('tr');
    releases.forEach(function(r){
      head1.appendChild(el('th', { scope: 'colgroup', colspan: String(PLATFORMS.length), text: str(r.channel) + ' ' + str(r.version) }));
      PLATFORMS.forEach(function(p){ head2.appendChild(el('th', { scope: 'col', text: p.label })); });
    });
    var body = el('tbody');
    agents.forEach(function(agent){
      var row = el('tr', { 'data-harness': str(agent.id) }, [el('th', { scope: 'row', text: str(agent.name) })]);
      releases.forEach(function(r){
        PLATFORMS.forEach(function(p){ row.appendChild(cell(r, agent, p, entryOf(r, agent.id, p.id), issues)); });
      });
      body.appendChild(row);
    });
    out.appendChild(el('div', { 'class': 'tablewrap' }, [el('table', { 'class': 'matrix' }, [
      el('caption', { 'class': 'sr', text: 'The versions of each coding agent that each ConsensFlow release supports, on Mac and Windows' }),
      el('thead', {}, [head1, head2]),
      body
    ])]));

    if (issues.list.length) {
      out.appendChild(el('ol', { 'class': 'issues' }, issues.list.map(function(issue, i){
        return el('li', {}, [el('span', { 'class': 'mark', text: String(i + 1) }), el('span', { text: issue.text + (SAID[issue.state] || '') })]);
      })));
    }
    if (data.opencode && data.opencode.text) {
      out.appendChild(el('p', { 'class': 'other', text: str(data.opencode.name) + ': ' + str(data.opencode.text) }));
    }
  }

  var data;
  try { data = JSON.parse(document.getElementById('status-data').textContent); } catch (e) { data = null; }
  if (!data || !Array.isArray(data.releases) || !Array.isArray(data.harnesses)) {
    var note = document.getElementById('unavailable');
    note.textContent = UNAVAILABLE;
    note.hidden = false;
    if (window.console) console.warn('Supported versions: the data block could not be read.');
  } else {
    show(data);
  }
})();
</script>
